<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a4f4a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f2622;stop-opacity:1" />
    </linearGradient>

    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <rect width="200" height="200" rx="48" fill="url(#bgGradient)" filter="url(#shadow)"/>
  
  <g filter="url(#shadow)">
    <rect x="50" y="30" width="100" height="140" rx="8" fill="none" stroke="white" stroke-width="6"/>
  </g>
  
  <line x1="60" y1="65" x2="140" y2="65" stroke="white" stroke-width="2.5" opacity="0.8"/>
  <line x1="60" y1="100" x2="140" y2="100" stroke="white" stroke-width="2.5" opacity="0.8"/>
  <line x1="60" y1="135" x2="120" y2="135" stroke="white" stroke-width="2.5" opacity="0.8"/>
</svg>
